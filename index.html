<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Gridiron Drive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;800&family=Barlow:wght@400;600&display=swap">
<style>
/* Layout: full-bleed 3D field, broadcast-style score bug top-left, playbook / throw meter docked bottom-center */
:root{
  --bg:#0c1512; --panel:rgba(9,15,13,.84); --line:rgba(255,255,255,.14);
  --fg:#eef3ee; --muted:#9db3a6; --accent:#ffd21f; --def:#ff7a6b; --good:#6be38f; --los:#3d8bff; --home:#d94a2b;
  --display:"Saira Condensed","Arial Narrow",sans-serif; --body:"Barlow",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);overflow:hidden;font-family:var(--body)}
#game{position:fixed;inset:0}
#game canvas{display:block;outline:none;cursor:crosshair}
.hud{position:fixed;pointer-events:none;z-index:2}
#top{top:calc(12px + env(safe-area-inset-top,0px));left:16px;right:16px;display:flex;flex-wrap:wrap;gap:8px}
.board{display:flex;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden;font-family:var(--display)}
.team{background:var(--home);padding:6px 14px;display:flex;align-items:center;gap:12px;font-weight:800;letter-spacing:.08em;font-size:18px}
.team b{font-size:28px;font-variant-numeric:tabular-nums}
.cell{padding:6px 14px;border-left:1px solid var(--line);display:flex;flex-direction:column;justify-content:center;gap:2px}
.cell small{font-family:var(--body);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.cell b{font-size:22px;line-height:1;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.cell.down b{color:var(--accent)}
.cell.defense b{color:var(--def)}
#hint b{color:var(--def)}
#dock{left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:10px}
#plays{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px;pointer-events:auto;max-width:960px}
#plays .group{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding-inline:4px 2px}
.play{font-family:var(--display);font-weight:600;font-size:16px;letter-spacing:.04em;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:7px 12px;display:flex;align-items:center;gap:8px;cursor:pointer}
.play kbd{font-family:var(--body);font-size:11px;font-weight:600;border:1px solid var(--line);border-radius:3px;padding:1px 5px;color:var(--muted)}
.play[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.play[aria-pressed="true"] kbd{color:var(--accent);border-color:var(--accent)}
.play:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.play.mode{pointer-events:auto;align-self:flex-start}
#meter{width:min(320px,100%);display:flex;flex-direction:column;gap:4px}
#meter .bar{height:10px;border-radius:5px;background:var(--panel);border:1px solid var(--line);overflow:hidden}
#meter .fill{height:100%;width:0;background:linear-gradient(90deg,var(--fg),var(--accent))}
#meter .ends{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
#hint{font-size:13px;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 14px;text-align:center;max-width:100%}
#hint kbd{font-family:var(--body);font-weight:600;color:var(--accent)}
#banner{left:16px;right:16px;top:26%;text-align:center;opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s}
#banner.on{opacity:1;transform:none}
#banner h1{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(40px,9vw,84px);letter-spacing:.04em;line-height:1;text-shadow:0 4px 24px rgba(0,0,0,.6);text-wrap:balance}
#banner p{margin:8px 0 0;font-size:17px;font-weight:600;color:var(--accent);text-shadow:0 2px 10px rgba(0,0,0,.8)}
#toast{left:16px;right:16px;top:calc(84px + env(safe-area-inset-top,0px));text-align:center;font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:.06em;color:var(--accent);text-shadow:0 2px 12px rgba(0,0,0,.8);opacity:0;transition:opacity .25s}
#toast.on{opacity:1}
[hidden]{display:none!important}
#labels{inset:0;z-index:1;overflow:hidden}
.callout{position:absolute;left:0;top:0;white-space:nowrap;font-family:var(--display);font-weight:800;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg);text-shadow:0 1px 2px #000,0 0 8px rgba(0,0,0,.7)}
.callout.bad{color:var(--def)}
.callout.good{color:var(--good)}
@media (prefers-reduced-motion:reduce){#banner,#toast{transition:none}}
</style>

<div id="game"></div>

<div class="hud" id="top">
  <div class="board">
    <div class="team">HAWKS <b id="score">0</b></div>
    <div class="cell down"><small>Down</small><b id="down">1st &amp; 10</b></div>
    <div class="cell"><small>Ball on</small><b id="spot">OWN 25</b></div>
    <div class="cell"><small>Drive</small><b id="drive">1 / 6</b></div>
    <div class="cell defense"><small>Defense</small><b id="defcall">Base</b></div>
  </div>
  <button class="play mode" id="cpuBtn" type="button" aria-pressed="true"><kbd>C</kbd>CPU vs CPU</button>
  <button class="play mode" id="camBtn" type="button"><kbd>V</kbd>Broadcast</button>
</div>

<div class="hud" id="banner"><h1 id="bannerH"></h1><p id="bannerP"></p></div>
<div class="hud" id="toast"></div>
<div class="hud" id="labels"></div>

<div class="hud" id="dock">
  <div id="plays"></div>
  <div id="meter" hidden><div class="ends"><span>Bullet</span><span>Lob</span></div><div class="bar"><div class="fill" id="fill"></div></div></div>
  <div id="hint"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const HW = 26.665, MAX_DRIVES = 6, PX = 16;
const $ = id => document.getElementById(id);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const dist = (a,b) => Math.hypot(a.x-b.x, a.y-b.y);
const rand = (a,b) => a + Math.random()*(b-a);

// ---------- renderer / scene ----------
const wrap = $('game');
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
wrap.appendChild(renderer.domElement);
const cvs = renderer.domElement; cvs.tabIndex = 0;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0c1512);
scene.fog = new THREE.Fog(0x0c1512, 80, 180);
const camera = new THREE.PerspectiveCamera(52, 1, 0.5, 500);
scene.add(new THREE.HemisphereLight(0xffffff, 0x2a4030, 0.95));
const sun = new THREE.DirectionalLight(0xffffff, 0.55); sun.position.set(-20, 50, 20); scene.add(sun);
function resize(){ const w = wrap.clientWidth, h = wrap.clientHeight; renderer.setSize(w, h); camera.aspect = w/h; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

// game coords: x = lateral (yards from center), y = yard line (0 own goal, 100 opponent goal)
const toWorld = (x, y, h=0) => new THREE.Vector3(x, h, 50 - y);

// ---------- field ----------
const fieldCanvas = document.createElement('canvas');
fieldCanvas.width = Math.round(HW*2*PX); fieldCanvas.height = 120*PX;
const fieldTex = new THREE.CanvasTexture(fieldCanvas);
fieldTex.anisotropy = renderer.capabilities.getMaxAnisotropy();
function drawField(){
  const g = fieldCanvas.getContext('2d'), w = fieldCanvas.width;
  const Y = yd => (110 - yd)*PX, X = x => (x + HW)*PX;
  for(let yd = 0; yd < 100; yd += 5){ g.fillStyle = (yd/5)%2 ? '#2f7a3a' : '#2a6f35'; g.fillRect(0, Y(yd+5), w, 5*PX); }
  g.fillStyle = '#9b2f1f'; g.fillRect(0, Y(0), w, 10*PX);
  g.fillStyle = '#1f3c7a'; g.fillRect(0, 0, w, 10*PX);
  g.fillStyle = '#fff';
  for(let yd = 0; yd <= 100; yd += 5){ const t = (yd%50===0) ? 6 : 3; g.fillRect(0, Y(yd)-t/2, w, t); }
  for(let yd = 1; yd < 100; yd++){ if(yd%5===0) continue;
    for(const x of [-HW+0.4, -3.08, 3.08, HW-1.0]) g.fillRect(X(x), Y(yd)-1, 0.6*PX, 2); }
  g.fillRect(0, 0, 6, fieldCanvas.height); g.fillRect(w-6, 0, 6, fieldCanvas.height);
  g.fillRect(0, 0, w, 6); g.fillRect(0, fieldCanvas.height-6, w, 6);
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.font = `600 ${2.2*PX}px "Saira Condensed","Arial Narrow",sans-serif`;
  for(let yd = 10; yd < 100; yd += 10){
    const label = String(yd <= 50 ? yd : 100 - yd);
    for(const [x, rot] of [[-HW+9, Math.PI/2], [HW-9, -Math.PI/2]]){
      g.save(); g.translate(X(x), Y(yd)); g.rotate(rot); g.fillText(label, 0, 0); g.restore();
    }
  }
  g.font = `800 ${6*PX}px "Saira Condensed","Arial Narrow",sans-serif`;
  g.fillStyle = 'rgba(255,255,255,.9)';
  g.fillText('HAWKS', w/2, Y(-5)); g.fillText('WOLVES', w/2, Y(105));
  fieldTex.needsUpdate = true;
}
drawField();
if(document.fonts) document.fonts.ready.then(drawField);
const field = new THREE.Mesh(new THREE.PlaneGeometry(HW*2, 120), new THREE.MeshLambertMaterial({map:fieldTex}));
field.rotation.x = -Math.PI/2; scene.add(field);
const apron = new THREE.Mesh(new THREE.PlaneGeometry(220, 300), new THREE.MeshLambertMaterial({color:0x1a3a24}));
apron.rotation.x = -Math.PI/2; apron.position.y = -0.02; scene.add(apron);
// goalposts
const postMat = new THREE.MeshLambertMaterial({color:0xf2c81e});
for(const yd of [-10, 110]){
  const z = 50 - yd, gp = new THREE.Group();
  const up = new THREE.Mesh(new THREE.CylinderGeometry(0.15,0.15,3.3), postMat); up.position.set(0,1.65,0);
  const cross = new THREE.Mesh(new THREE.CylinderGeometry(0.12,0.12,6.17), postMat); cross.rotation.z = Math.PI/2; cross.position.y = 3.3;
  const l = new THREE.Mesh(new THREE.CylinderGeometry(0.1,0.1,10), postMat); l.position.set(-3.08, 8.3, 0);
  const r = l.clone(); r.position.x = 3.08;
  gp.add(up, cross, l, r); gp.position.z = z; scene.add(gp);
}
// line of scrimmage + first-down line
const stripe = c => { const m = new THREE.Mesh(new THREE.PlaneGeometry(HW*2, 0.35), new THREE.MeshBasicMaterial({color:c, transparent:true, opacity:.9, depthWrite:false})); m.rotation.x = -Math.PI/2; m.position.y = 0.02; scene.add(m); return m; };
const losLine = stripe(0x3d8bff), fdLine = stripe(0xffd21f);

// ---------- players ----------
// boxy jointed figure; every limb geometry hangs down from its pivot
const box = (w, h, d, x=0, y=-h/2, z=0) => new THREE.BoxGeometry(w, h, d).translate(x, y, z);
const G = {
  torso: box(0.75,0.7,0.42,0,0.37), pads: box(1.05,0.22,0.5,0,0.7), helmet: box(0.46,0.44,0.5,0,0.24),
  stripe: box(0.08,0.46,0.54,0,0.25), mask: box(0.36,0.14,0.08,0,0.18,0.27),
  upperArm: box(0.2,0.42,0.22), forearm: box(0.18,0.4,0.2),
  thigh: box(0.28,0.5,0.3), shin: box(0.24,0.45,0.26), cleat: box(0.24,0.1,0.38,0,-0.5,0.06),
  shadow: new THREE.CircleGeometry(0.62,20)
};
const shadowMat = new THREE.MeshBasicMaterial({color:0x000000, transparent:true, opacity:.28, depthWrite:false});
const TEAM = {
  O: {jersey:0xd94a2b, pants:0xf3efe6, helmet:0xb8361e, stripe:0xffffff, socks:0xd94a2b},
  D: {jersey:0x1f3c7a, pants:0xc9cfdc, helmet:0x15295a, stripe:0xffd21f, socks:0x1f3c7a}
};
const SKIN = [0x5c3a1e, 0x8d5524, 0xc68642, 0xe0ac69, 0xf1c27d];
const mats = {};
const mat = c => mats[c] || (mats[c] = new THREE.MeshLambertMaterial({color:c}));
const JOINTS = ['lean','twist','hipL','hipR','kneeL','kneeR','shL','shR','elL','elR','drop','pitch','bob'];
function makePlayer(team, role){
  const t = TEAM[team], skin = SKIN[Math.floor(Math.random()*SKIN.length)];
  const g = new THREE.Group(), body = new THREE.Group();
  const pivot = (parent, x, y, z=0) => { const p = new THREE.Group(); p.position.set(x, y, z); parent.add(p); return p; };
  const add = (parent, geo, c) => parent.add(new THREE.Mesh(geo, mat(c)));
  const torso = pivot(body, 0, 1.0);
  add(torso, G.torso, t.jersey); add(torso, G.pads, t.jersey);
  const head = pivot(torso, 0, 0.8);
  add(head, G.helmet, t.helmet); add(head, G.stripe, t.stripe); add(head, G.mask, 0x222222);
  const arm = side => { // side: +1 left (+x), -1 right (-x)
    const sh = pivot(torso, side*0.5, 0.62); add(sh, G.upperArm, t.jersey);
    const el = pivot(sh, 0, -0.42); add(el, G.forearm, skin);
    return [sh, el];
  };
  const leg = side => {
    const hip = pivot(body, side*0.2, 1.0); add(hip, G.thigh, t.pants);
    const knee = pivot(hip, 0, -0.5); add(knee, G.shin, t.socks); add(knee, G.cleat, 0x1a1a1a);
    return [hip, knee];
  };
  const [shL, elL] = arm(1), [shR, elR] = arm(-1), [hipL, kneeL] = leg(1), [hipR, kneeR] = leg(-1);
  const sh = new THREE.Mesh(G.shadow, shadowMat); sh.rotation.x = -Math.PI/2; sh.position.y = 0.035;
  g.add(body, sh); scene.add(g);
  const pose = {}; JOINTS.forEach(j => pose[j] = 0);
  return {team, role, skin, mesh:g, body, j:{torso, head, shL, elL, shR, elR, hipL, kneeL, hipR, kneeR}, pose,
          x:0, y:0, vx:0, vy:0, spd:7, stun:0, acc:5, brake:7.5, turn:6, accel:0, stride:Math.random()*6, face:0, act:null, actT:0, eng:0};
}
const QB = makePlayer('O','QB');
const LT = makePlayer('O','OL'), LG = makePlayer('O','OL'), C = makePlayer('O','OL'), RG = makePlayer('O','OL'), RT = makePlayer('O','OL');
const WRs = [makePlayer('O','WR'), makePlayer('O','WR'), makePlayer('O','WR')];
const TE = makePlayer('O','WR'), RB = makePlayer('O','WR');
const OL = [LT, LG, C, RG, RT], RECV = [...WRs, TE, RB], ROUTE_KEYS = ['out','out','slot','te','rb'];
const OFF = [QB, ...OL, ...RECV];
const DL = [makePlayer('D','DL'), makePlayer('D','DL'), makePlayer('D','DL'), makePlayer('D','DL')];
const LBs = [makePlayer('D','LB'), makePlayer('D','LB')];
const CBs = [makePlayer('D','CB'), makePlayer('D','CB'), makePlayer('D','CB')];
const SFs = [makePlayer('D','S'), makePlayer('D','S')];
const DEF = [...DL, ...LBs, ...CBs, ...SFs], ALL = [...OFF, ...DEF];
// ratings (kept for the whole game): blockers have strength / agility, defenders power / speed
{
  const R = (a, b) => Math.round(rand(a, b));
  const rate = (p, a, b, c, e) => { if(p.team === 'O'){ p.rStr = R(a, b); p.rAgi = R(c, e); } else { p.rPow = R(a, b); p.rSpd = R(c, e); } };
  OL.forEach(o => rate(o, 70, 90, 55, 80)); rate(TE, 60, 80, 60, 75); rate(RB, 55, 70, 60, 75);
  WRs.forEach(w => rate(w, 40, 60, 60, 80)); rate(QB, 35, 45, 45, 55);
  DL.forEach((d, i) => (i === 0 || i === 3) ? rate(d, 60, 80, 72, 90) : rate(d, 75, 92, 55, 70));   // ends: speed, tackles: power
  LBs.forEach(b => rate(b, 60, 75, 60, 78)); CBs.forEach(c => rate(c, 40, 60, 65, 85)); SFs.forEach(s => rate(s, 50, 65, 60, 80));
  // tackling: ball carriers have break-tackle (rBrk), defenders tackling (rTkl); mass in lb drives collisions
  const MASS = {RB:215, WR:195, TE:250, QB:220, OL:310, DT:305, DE:270, LB:240, CB:195, S:205};
  OFF.forEach(o => o.rBrk = o === RB ? R(65, 85) : o === TE ? R(65, 80) : o === QB ? R(40, 55) : R(50, 70));
  DEF.forEach(d => d.rTkl = d.role === 'LB' ? R(75, 90) : d.role === 'S' ? R(70, 85) : d.role === 'CB' ? R(60, 78) : R(65, 80));
  // awareness: how fast he reads the play and how cleanly he takes his angles
  DEF.forEach(d => d.rAwr = d.role === 'LB' || d.role === 'S' ? R(65, 90) : R(55, 80));
  // movement: [acceleration, cut/turn] in yd/s²; braking is 1.5x acceleration
  const MOVE = {RB:[7.2,13], WR:[6.5,8.5], TE:[6,6.5], QB:[5,6.5], OL:[5.6,5.5], DT:[5.8,6], DE:[6.2,7], LB:[5.8,7.5], CB:[6.5,8.5], S:[6,8]};
  ALL.forEach(p => {
    const key = p === RB ? 'RB' : p === TE ? 'TE' : p.role === 'DL' ? (p === DL[0] || p === DL[3] ? 'DE' : 'DT') : p.role;
    const [a, t] = MOVE[key];
    p.acc = a*rand(0.92, 1.08); p.brake = p.acc*1.5; p.turn = t*rand(0.92, 1.08);
    p.mass = MASS[key]*rand(0.95, 1.05);
  });
}

// ---------- ball + markers ----------
const ballMesh = new THREE.Mesh(new THREE.SphereGeometry(0.1, 14, 10), new THREE.MeshLambertMaterial({color:0x7a3e1d}));
ballMesh.scale.set(1, 1, 1.75); scene.add(ballMesh);
const flat = (geo, c, op=1) => { const m = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({color:c, transparent:true, opacity:op, depthWrite:false})); m.rotation.x = -Math.PI/2; m.position.y = 0.05; scene.add(m); return m; };
const ctrlRing = flat(new THREE.RingGeometry(0.75, 0.95, 32), 0xffd21f, .95);
const aimRing = flat(new THREE.RingGeometry(0.9, 1.15, 32), 0xffffff, .9);
const landRing = flat(new THREE.RingGeometry(1.1, 1.4, 32), 0xffd21f, .85);
const ARC_N = 28;
const arcGeo = new THREE.BufferGeometry(); arcGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array((ARC_N+1)*3), 3));
const arcLine = new THREE.Line(arcGeo, new THREE.LineBasicMaterial({color:0xffffff, transparent:true, opacity:.55}));
scene.add(arcLine);

// route preview ribbons
const routeMat = new THREE.MeshBasicMaterial({color:0xffe066, transparent:true, opacity:.6, depthWrite:false});
const routeGroup = new THREE.Group(); scene.add(routeGroup);
function seg(a, b, w, material=routeMat, group=routeGroup){
  const dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy);
  if(len < 0.05) return;
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, len), material);
  m.rotation.order = 'YXZ'; m.rotation.x = -Math.PI/2; m.rotation.y = Math.atan2(-dx, dy);
  m.position.copy(toWorld((a.x+b.x)/2, (a.y+b.y)/2, 0.04)); group.add(m);
}
// defensive call preview: red lines from each box defender to the gap he will attack
const fitMat = new THREE.MeshBasicMaterial({color:0xff5a4a, transparent:true, opacity:.7, depthWrite:false});
const fitGroup = new THREE.Group(); scene.add(fitGroup);
const DEF_CALLS = [
  {name:'Base',             note:'Linemen hold their gaps, linebackers read and fill', slant:0},
  {name:'Slant Left',       note:'Whole line slants one gap to your left', slant:-1.8},
  {name:'Slant Right',      note:'Whole line slants one gap to your right', slant:1.8},
  {name:'Run Blitz',        note:'One linebacker shoots his gap at the snap', slant:0, blitz:true},
  {name:'Eight in the Box', note:'A safety rolls down and the linebackers trigger fast', slant:0, box:true, fastLB:true}
];
function drawFits(){
  fitGroup.children.forEach(c => c.geometry.dispose()); fitGroup.clear();
  for(const d of DEF) if(d.fit) seg(d, d.fit, d.mode === 'rush' && d.role === 'LB' ? 0.4 : 0.25, fitMat, fitGroup);
  fitGroup.visible = true;
}
function drawRoutes(){
  routeGroup.children.forEach(c => c.geometry.dispose()); routeGroup.clear();
  for(const w of RECV){
    let prev = {x:w.x, y:w.y};
    for(const p of w.route){ seg(prev, p, 0.3); prev = p; }
    if(w.go) seg(prev, {x:prev.x + w.goDir.x*6, y:prev.y + w.goDir.y*6}, 0.3);
  }
}

// ---------- playbook ----------
// route points: [yards toward the middle, yards downfield from the line]
const PASS_GAME = false;   // pass plays parked while the run game gets tuned; flip to bring them back
const PLAYS = [
  {name:'Slants',        out:{pts:[[0,3],[7,9]], go:true},    slot:{pts:[[0,3],[7,9]], go:true},
                         te:{pts:[[0,10],[0,40]], go:true},   rb:{pts:[[-5,1],[-8,3]], go:false}},
  {name:'Verticals',     out:{pts:[[-2,10],[-2,45]], go:true}, slot:{pts:[[1,10],[2,45]], go:true},
                         te:{pts:[[0,10],[1,45]], go:true},   rb:{pts:[[-4,2],[-3,6]], go:false}},

  place(WRs[0], -20, L-0.8); place(WRs[1], 20, L-0.8); place(WRs[2], -11, L-1.0);
  place(TE, 6.8, L-1.0); place(RB, 1.8, L-4.5);

const canThrow = () => S.phase === 'live' && ball.state === 'held' && ball.holder === QB && !S.runMode;
const charge = () => Math.min(1, S.chargeT/0.9);

function snap(){
  const run = PLAYS[S.play].run;
  S.phase = 'live'; S.clock = 0; S.runMode = !!run;
  S.ctrl = run && run !== 'keep' ? RB : QB;
  pitch(C, QB, 0.3);
  fitGroup.visible = false;
  if(run === 'keep'){ S.handoffAt = PLAYS[S.play].passSet || 0; QB.auto = true; QB.route = [{x:0.4, y:S.los + 1.5}]; QB.wp = 0; }
  if(run){
    const play = PLAYS[S.play];
    const OK = {LT, LG, C, RG, RT, TE, RB, WR0:WRs[0], WR1:WRs[1], WR2:WRs[2]};
    const lbs = [...LBs].sort((a, b) => a.x - b.x), sfs = [...SFs].sort((a, b) => a.x - b.x);
    const DK = {DL0:DL[0], DL1:DL[1], DL2:DL[2], DL3:DL[3], LB0:lbs[0], LB1:lbs[1], CB0:CBs[0], CB1:CBs[1], CB2:CBs[2], S0:sfs[0], S1:sfs[1]};
    for(const [o, d] of Object.entries(play.blocks || {})){ OK[o].blk = DK[d]; OK[o].scripted = true; }
    if(play.scheme === 'zone') [...OL, TE].forEach(o => { o.lane = o.x + play.shift; o.blk = null; });

    const boxS = SFs.find(f => f.fit && Math.sign(f.x) === Math.sign(play.shift || 0));
    if(play.scheme === 'zone' && boxS){ TE.blk = boxS; TE.locked = true; OFF.forEach(o => { if(o !== TE && o.blk === boxS) o.blk = null; }); }

// ---------- downs ----------
function endPlay(kind, y, note){
  S.phase = 'dead'; S.deadT = 2.2; S.charging = false;
  if(kind === 'td'){ S.score += 7; S.tds++; banner('TOUCHDOWN', '+7 points'); newDrive(); return; }
  if(kind === 'int'){ banner('INTERCEPTED', 'Drive over'); newDrive(); return; }
  if(kind === 'inc'){ S.down++; if(!checkDowns()) banner('INCOMPLETE', (note ? note + ' · ' : '') + downText()); updateHUD(); return; }
  if(y <= 0){ banner('SAFETY', 'Drive over'); newDrive(); return; }
  const spot = clamp(Math.round(y), 1, 99), gain = spot - S.los;
  S.los = spot;
  const head = note || (gain > 0 ? `+${gain} YARDS` : gain < 0 ? `LOSS OF ${-gain}` : 'NO GAIN');
  if(gain >= S.toGo){ S.down = 1; S.toGo = Math.min(10, 100 - spot); banner(head, 'First down · ' + downText()); }
  else { S.down++; S.toGo -= gain; if(!checkDowns()) banner(head, downText()); }

  const w = {'Inside Zone':1, 'Power Left':1, 'Outside Zone Right':1, 'QB Draw':0.4}, call = S.defCall.name;
  if(S.toGo <= 2){ w['Inside Zone'] += 1.5; w['Power Left'] += 1.5; }
  if(S.toGo >= 7){ w['Outside Zone Right'] += 1; w['QB Draw'] += 0.6; }
  if(call === 'Slant Left'){ w['Outside Zone Right'] += 1.5; w['Power Left'] = Math.max(0.2, w['Power Left'] - 0.6); }   // run away from the slant
  if(call === 'Slant Right') w['Power Left'] += 1.5;

  if(call === 'Eight in the Box') w['Outside Zone Right'] += 1.5;                                                       // get outside the extra man
  const names = Object.keys(w).filter(n => playIdx(n) >= 0), tot = names.reduce((a, n) => a + w[n], 0);

// ---------- movement ----------
// Movement physics. The velocity change is split along the current heading (speed up / brake) and
// across it (turn). Acceleration fades toward top speed, braking is harder than accelerating, and the
// sideways limit means a full-speed cut has to shed speed first. Rates are per player (yd/s²).
// (The trailing argument some callers still pass is ignored.)
function steerVel(p, dvx, dvy, dt){
  const slow = p.slow || 1; dvx *= slow; dvy *= slow;   // tacklers hanging on
  const sp = Math.hypot(p.vx, p.vy);
  let ux, uy;
  if(sp > 0.3){ ux = p.vx/sp; uy = p.vy/sp; }
  else {
    const dl = Math.hypot(dvx, dvy);
    if(dl < 0.05){ p.vx = p.vy = 0; p.accel = 0; return; }
    ux = dvx/dl; uy = dvy/dl;

  const ex = dvx - p.vx, ey = dvy - p.vy;
  const par = ex*ux + ey*uy, px = ex - par*ux, py = ey - par*uy;
  const aMax = par > 0 ? p.acc*Math.max(0.2, 1 - (sp/(p.spd*1.15))**2) : p.brake;
  const dPar = clamp(par, -aMax*dt, aMax*dt);
  const pl = Math.hypot(px, py), lim = p.turn*dt, k = pl > lim ? lim/pl : 1;
  p.vx += dPar*ux + px*k; p.vy += dPar*uy + py*k;
  p.latAcc = pl*k/dt;   // sideways acceleration: how hard he is cutting
  p.accel = dPar/dt;
  p.x += p.vx*dt; p.y += p.vy*dt;
}
function steer(p, tx, ty, speed, dt){
  const dx = tx - p.x, dy = ty - p.y, d = Math.hypot(dx, dy);
  // arrive: never faster than what he can still brake from before the target
  const s = d > 0.05 ? Math.min(speed, Math.sqrt(2*p.brake*d))/d : 0;
  steerVel(p, dx*s, dy*s, dt);
}
function runRoute(w, dt){

    if(!n && !w.go){ if(d < 0.7) w.wp++; steer(w, t.x, t.y, w.spd, dt); return; }   // a route that stops (curl): settle on the spot
    // through waypoints at full speed, rounding each corner by aiming partway at the next one
    if(d < 1.2) { w.wp++; runRoute(w, dt); return; }
    const k = n ? clamp(1 - d/2.5, 0, 1)*0.6 : 0, ax = t.x + (n ? (n.x - t.x)*k : 0), ay = t.y + (n ? (n.y - t.y)*k : 0);

// ---------- tackling ----------
// Contact starts an attempt (ratings + momentum decide what the tackler gets), and from there it's bodies:
//   big hit: the tackler launches through him and the runner is knocked off his feet; the collision does the rest
//   slip:    the tackler dives and comes up empty
//   grab:    the tackler's hands lock onto him (arm = one hand, wrap = both), he plants and drives.
// The runner keeps his legs (bal) and drives on; a grip only holds as much force as the tackler's hands,
// so a strong runner tears out of an arm tackle. Takedown progress (tackler ratings vs break-tackle) bleeds
// his balance; when it's gone he falls the way the forces on him send him. Down = anything but feet on turf.

function attemptTackle(d, c, dd){

function tackleUpdate(c, dt, inp){

    if(!c.ph || physDown(c) || c.ph.t > 4) endPlay('spot', c.ph ? 50 - physBall(c).z : c.y, tackleNote(c));   // ball spotted where he's down
    return;
  }
  if(c.tripT > 0) c.tripT -= dt;
  for(const d of DEF){
    if(d.latch || d.stun > 0 || d.tkCool > 0 || d.ph) continue;
    const dd = dist(d, c);
    if(d.bt){
      // blocked: can't tackle, but can reach out and grab a piece of him as he goes by
      if(dd < 1.6 && !(d.reachCool > 0)){

    d.slip = Math.max(0, (d.slip || 0) + (gripStrain(d) > 1 ? dt : -dt*0.5));   // pulled harder than he can hold: hands sliding off

// ---------- animation ----------
// joint signs: negative hip/shoulder = swing forward, positive knee = bend, positive lean/pitch = tip forward
function targetPose(p, sp){

  // forward centre; the knee folds while the leg swings through (thigh moving forward, cos > 0, peak as it
  // passes under the hip) and straightens as the thigh reaches forward for the next plant. Arms pump opposite
  // the legs with elbows near 90°, the torso counter-rotates a touch, and there's a small float at mid-stride.

  const T = {lean:0.1 + 0.3*r + clamp(p.accel*0.035, -0.25, 0.3), twist:0.14*s*r,

    else { Object.assign(T, {lean:0.45, hipL:-0.55, hipR:-0.35, kneeL:0.9, kneeR:0.7, drop:0.15}); arms(-0.3, -0.3, -0.7); }

  else if(p === QB && p.act === 'throw'){ T.twist = 0.5; T.lean = 0.45; T.shR = -1.7; T.elR = -0.2; T.shL = 0.3; }

  else if(p.bt && p.team === 'D' && p.bt.phase === 'move'){ arms(-1.7, -1.7, -0.1); T.lean = 0.9; }                                // bull rush

      const k = i/ARC_N, x = QB.x + (tx - QB.x)*k, y = QB.y + (ty - QB.y)*k, h = 2.0 - 0.6*k + 4*arc.apex*k*(1-k);
      pos[i*3] = x; pos[i*3+1] = h; pos[i*3+2] = 50 - y;
    }
    arcGeo.attributes.position.needsUpdate = true;
  }
  // dock
  $('plays').hidden = S.phase !== 'presnap';
  $('meter').hidden = !aiming;
  $('fill').style.width = (S.charging ? charge()*100 : 0) + '%';
  if(S.cpu && S.phase !== 'over') setHint(`CPU vs CPU · <b>${S.defCall ? S.defCall.name : ''}</b> · <kbd>C</kbd> take control · <kbd>V</kbd> camera`);
  else if(S.phase === 'presnap') setHint(`<b>${S.defCall.name}:</b> ${S.defCall.note} · Pick a play <kbd>1–${PLAYS.length}</kbd> · <kbd>Click</kbd> to hike`);
  else if(S.runMode && S.phase === 'live' && S.ctrl === RB && !(ball.state === 'held' && ball.holder === RB)) setHint('Handoff coming · <kbd>WASD</kbd> takes over once he has the ball');
  else if(S.runMode && S.phase === 'live' && S.ctrl.auto) setHint('Following the play · <kbd>WASD</kbd> to take over, <kbd>Shift</kbd> to sprint');
  else if(aiming || (ball.state === 'pitch' && !S.runMode)) setHint('<kbd>WASD</kbd> drop back · Aim with the mouse · <kbd>Hold</kbd> for more arc, release to throw');
  else if(ball.state === 'air') setHint('<kbd>WASD</kbd> to adjust the receiver, or let him run to the ball');
  else if(S.phase === 'live') setHint('<kbd>WASD</kbd> to run · <kbd>Shift</kbd> to sprint');
  else if(S.phase === 'over') setHint('<kbd>Click</kbd> to start a new game');
  else setHint('Next play…');
}

let last = performance.now();
function frame(now){
  const dt = clamp((now - last)/1000, 0, 0.05); last = now;
  if(dt === 0){ requestAnimationFrame(frame); return; }
  ray.setFromCamera(ndc, camera);
  if(ray.ray.intersectPlane(ground, hit)){ aim.x = hit.x; aim.y = 50 - hit.z; }
  cpuTick(dt);
  if(S.phase === 'live') liveUpdate(dt);
  else if(S.phase === 'dead'){
    ALL.forEach(p => steer(p, p.x, p.y, 0, dt, 4));
    S.deadT -= dt; if(S.deadT <= 0) nextPlay();
  }
  physStep(dt);
  updateCamera(dt); syncScene(dt); physRender(); updateCallouts(dt);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

function start(data){
  $('cpuBtn').addEventListener('click', () => { setCpu(!S.cpu); cvs.focus(); });
  $('camBtn').addEventListener('click', () => { setCam(S.cam === 'tv' ? 'behind' : 'tv'); cvs.focus(); });
  setCam(S.cam);
  if(data && typeof data.score === 'number') Object.assign(S, {score:data.score, tds:data.tds||0, drive:data.drive||1, los:data.los||25, down:data.down||1, toGo:data.toGo||10});
  selectPlay(0); setupPlay(); requestAnimationFrame(frame);
}
try { window.claude?.hot?.snapshot?.(() => ({score:S.score, tds:S.tds, drive:S.drive, los:S.los, down:S.down, toGo:S.toGo})); } catch(e){}
const boot = () => window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
(window.CANNON ? Promise.resolve(window.CANNON) : import('https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js'))
  .then(m => { window.CANNON = m; physInit(); }, () => {}).then(boot);   // without physics the game still runs (no tackle bodies)
})();
</script>
