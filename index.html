<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Gridiron Drive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;800&family=Barlow:wght@400;600&display=swap">
<style>
/* Layout: full-bleed 3D field, broadcast-style score bug top-left, playbook / throw meter docked bottom-center */
:root{
  --bg:#0c1512; --panel:rgba(9,15,13,.84); --line:rgba(255,255,255,.14);
  --fg:#eef3ee; --muted:#9db3a6; --accent:#ffd21f; --def:#ff7a6b; --good:#6be38f; --los:#3d8bff; --home:#d94a2b;
  --display:"Saira Condensed","Arial Narrow",sans-serif; --body:"Barlow",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);overflow:hidden;font-family:var(--body)}
#game{position:fixed;inset:0}
#game canvas{display:block;outline:none;cursor:crosshair}
.hud{position:fixed;pointer-events:none;z-index:2}
#top{top:calc(12px + env(safe-area-inset-top,0px));left:16px;right:16px;display:flex;flex-wrap:wrap;gap:8px}
.board{display:flex;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden;font-family:var(--display)}
.team{background:var(--home);padding:6px 14px;display:flex;align-items:center;gap:12px;font-weight:800;letter-spacing:.08em;font-size:18px}
.team b{font-size:28px;font-variant-numeric:tabular-nums}
.cell{padding:6px 14px;border-left:1px solid var(--line);display:flex;flex-direction:column;justify-content:center;gap:2px}
.cell small{font-family:var(--body);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.cell b{font-size:22px;line-height:1;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.cell.down b{color:var(--accent)}
.cell.defense b{color:var(--def)}
#hint b{color:var(--def)}
#dock{left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:10px}
#plays{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px;pointer-events:auto;max-width:960px}
#plays .group{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding-inline:4px 2px}
.play{font-family:var(--display);font-weight:600;font-size:16px;letter-spacing:.04em;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:7px 12px;display:flex;align-items:center;gap:8px;cursor:pointer}
.play kbd{font-family:var(--body);font-size:11px;font-weight:600;border:1px solid var(--line);border-radius:3px;padding:1px 5px;color:var(--muted)}
.play[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.play[aria-pressed="true"] kbd{color:var(--accent);border-color:var(--accent)}
.play:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.play.mode{pointer-events:auto;align-self:flex-start}
#meter{width:min(320px,100%);display:flex;flex-direction:column;gap:4px}
#meter .bar{height:10px;border-radius:5px;background:var(--panel);border:1px solid var(--line);overflow:hidden}
#meter .fill{height:100%;width:0;background:linear-gradient(90deg,var(--fg),var(--accent))}
#meter .ends{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
#hint{font-size:13px;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 14px;text-align:center;max-width:100%}
#hint kbd{font-family:var(--body);font-weight:600;color:var(--accent)}
#banner{left:16px;right:16px;top:26%;text-align:center;opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s}
#banner.on{opacity:1;transform:none}
#banner h1{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(40px,9vw,84px);letter-spacing:.04em;line-height:1;text-shadow:0 4px 24px rgba(0,0,0,.6);text-wrap:balance}
#banner p{margin:8px 0 0;font-size:17px;font-weight:600;color:var(--accent);text-shadow:0 2px 10px rgba(0,0,0,.8)}
#toast{left:16px;right:16px;top:calc(84px + env(safe-area-inset-top,0px));text-align:center;font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:.06em;color:var(--accent);text-shadow:0 2px 12px rgba(0,0,0,.8);opacity:0;transition:opacity .25s}
#toast.on{opacity:1}
#warn{left:16px;top:calc(60px + env(safe-area-inset-top,0px));font-family:var(--display);font-weight:800;font-size:14px;letter-spacing:.06em;color:var(--accent);text-shadow:0 2px 8px rgba(0,0,0,.8);display:none}
#warn.on{display:block}
[hidden]{display:none!important}
#labels{inset:0;z-index:1;overflow:hidden}
.callout{position:absolute;left:0;top:0;white-space:nowrap;font-family:var(--display);font-weight:800;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--fg);text-shadow:0 1px 2px #000,0 0 8px rgba(0,0,0,.7)}
.callout.bad{color:var(--def)}
.callout.good{color:var(--good)}
@media (prefers-reduced-motion:reduce){#banner,#toast{transition:none}}
</style>

<div id="game"></div>

<div class="hud" id="top">
  <div class="board">
    <div class="team">HAWKS <b id="score">0</b></div>
    <div class="cell down"><small>Down</small><b id="down">1st &amp; 10</b></div>
    <div class="cell"><small>Ball on</small><b id="spot">OWN 25</b></div>
    <div class="cell"><small>Drive</small><b id="drive">1 / 6</b></div>
    <div class="cell defense"><small>Defense</small><b id="defcall">Base</b></div>
  </div>
  <button class="play mode" id="cpuBtn" type="button" aria-pressed="true"><kbd>C</kbd>CPU vs CPU</button>
  <button class="play mode" id="camBtn" type="button"><kbd>V</kbd>Broadcast</button>
</div>

<div class="hud" id="banner"><h1 id="bannerH"></h1><p id="bannerP"></p></div>
<div class="hud" id="toast"></div>
<div class="hud" id="warn"></div>
<div class="hud" id="labels"></div>

<div class="hud" id="dock">
  <div id="plays"></div>
  <div id="meter" hidden><div class="ends"><span>Bullet</span><span>Lob</span></div><div class="bar"><div class="fill" id="fill"></div></div></div>
  <div id="hint"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script type="module" src="src/main.js"></script>

</body></html>
