<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dots</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #10200f; font-family: sans-serif; }
  #field { position: fixed; inset: 0; }
  #field canvas { display: block; touch-action: none; }
  #tooltip { position: fixed; display: none; pointer-events: none; padding: 3px 7px; background: rgba(0,0,0,.8); color: #fff; font-size: 12px; border-radius: 3px; z-index: 5; white-space: pre; }
  #info-panel { position: fixed; top: 10px; left: 10px; min-width: 170px; padding: 10px 12px; background: rgba(0,0,0,.65); color: #fff; font-size: 13px; border-radius: 6px; z-index: 4; }
  #hint { position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%); display: flex; gap: 12px; align-items: center; padding: 6px 12px; background: rgba(0,0,0,.65); color: #fff; font-size: 12px; border-radius: 6px; z-index: 4; }
  #look-text { position: fixed; bottom: 60px; left: 10px; max-width: 300px; padding: 8px 10px; background: rgba(0,0,0,.65); color: #fff; font-size: 13px; border-radius: 6px; z-index: 4; pointer-events: none; }
  #version { position: fixed; top: 10px; right: 10px; padding: 3px 7px; background: rgba(0,0,0,.45); color: rgba(255,255,255,.75); font-size: 11px; border-radius: 4px; z-index: 4; pointer-events: none; white-space: nowrap; }
  #reset-btn { cursor: pointer; }
  #hint { flex-wrap: wrap; justify-content: center; max-width: calc(100vw - 20px); box-sizing: border-box; }
  #hint button { touch-action: manipulation; min-width: 36px; min-height: 36px; }
  @media (pointer: coarse), (max-width: 700px) {
    #hint { font-size: 16px; gap: 8px; padding: 8px 10px; }
    #hint button, #hint select { font-size: 16px; min-height: 44px; }
    #hint button { min-width: 44px; }
    #info-panel { font-size: 15px; }
    #look-text { font-size: 15px; }
    #tooltip { font-size: 15px; }
  }
</style>
</head>
<body>
<div id="field"></div>
<div id="tooltip"></div>
<div id="info-panel"></div>
<div id="look-text"></div>
<div id="version"></div>
<div id="hint"><button id="reset-btn">Reset (R)</button><button id="pause-btn" title="Pause (P)">Pause (P)</button><button id="step-btn" title="One tick (.)">Step (.)</button><select id="playside-select" title="Run direction"></select><select id="te-select" title="TE look"></select><button id="overlay-btn" title="Read overlay (O)">Overlay: off (O)</button><button id="fight-btn" title="Defense fights blocks (F)">Defense fights blocks: on (F)</button><button id="moves-btn" title="DL pass-rush moves (M)">Moves: on (M)</button><label id="recog-label" for="recog-range">Recognition: roster</label><input id="recog-range" type="range" min="0" max="99" step="1" value="0" title="Play recognition: 0 roster, 1 rookie, 99 prime Ray Lewis"><button id="speed-down" title="Slower (-)">−</button>
<button id="speed-up" title="Faster (+)">+</button><span>Click field to snap · drag to pan · wheel to zoom</span></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script type="module">
import { initDotsView } from './src/dots/view.js';
initDotsView(document.getElementById('field'));
</script>
</body>
</html>
